<style>
/* Tela de carregamento de entrada no jogo.
   Fundo: cena WebGL em tela cheia com o monograma "k." da Kloud extrudado em vidro
   (transmissão, iridescência), anéis de vidro e "pontos" da marca orbitando sobre
   uma aurora colorida animada. Embaixo, um cartão de vidro fosco com saudação,
   etapa atual e progresso. Ao terminar, o "k." gira e avança para a câmera e a
   página segue para kloudbrasil.com/jogo. Sempre escura, nos temas claro e escuro. */
:root {
  /* Cores institucionais (Manual de Identidade Visual Kloud) */
  --navy: #111D3B;        /* Azul 130 */
  --royal: #0236AB;       /* Azul 70 */
  --sky: #81C2FF;         /* Azul-claro, o ponto da marca */
  --offwhite: #F3F8F8;    /* Quase branco */
  /* Acentos do vidro colorido */
  --violet: #8A6BFF;
  --cyan: #45E3FF;

  --bg: #060B1C;
  --text: var(--offwhite);
  --text-muted: rgba(243, 248, 248, 0.7);
  --text-faint: rgba(243, 248, 248, 0.45);
  --glass: rgba(17, 29, 59, 0.38);
  --glass-line: rgba(243, 248, 248, 0.16);

  --font-display: "Magistral", "Archivo", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #060B1C; }
}
:root[data-theme="dark"] { --bg: #060B1C; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---------- CENA ---------- */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.2s ease; }
.has-3d #gl { opacity: 1; }

/* Plano B sem WebGL: aurora em CSS e o "k." em SVG */
.fallback { position: fixed; inset: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(45% 40% at 30% 30%, rgba(2, 54, 171, 0.7), transparent 70%),
    radial-gradient(40% 35% at 75% 40%, rgba(138, 107, 255, 0.45), transparent 70%),
    radial-gradient(35% 30% at 55% 70%, rgba(69, 227, 255, 0.25), transparent 70%),
    var(--bg);
  transition: opacity 1.2s ease; }
.fallback svg { position: absolute; left: 50%; top: 34%; width: min(52vw, 300px); height: auto; transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 30px rgba(129, 194, 255, 0.45)); }
.has-3d .fallback { opacity: 0; }

/* Vinheta para dar foco ao centro e contraste ao cartão */
.vignette { position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 35%, transparent 55%, rgba(3, 6, 16, 0.7)),
    linear-gradient(to top, rgba(3, 6, 16, 0.65), transparent 40%); }

/* ---------- INTERFACE ---------- */
.ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.top { display: flex; justify-content: center; align-items: center; gap: 12px; opacity: 0; animation: fadeDown .9s cubic-bezier(.2,.8,.2,1) .2s forwards; }
.top .brand-logo { height: 16px; width: auto; }
.top .sep { width: 1px; height: 14px; background: rgba(243, 248, 248, 0.3); }
.top .product { font-family: var(--font-display); font-stretch: 125%; font-weight: 700; font-size: 12px; letter-spacing: 0.24em; }

.card {
  pointer-events: auto; align-self: center; width: min(100%, 440px);
  padding: 24px 24px 22px; border-radius: 22px;
  background: linear-gradient(160deg, rgba(243, 248, 248, 0.09), transparent 45%), var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: inset 0 1px 0 rgba(243, 248, 248, 0.22), 0 24px 60px rgba(2, 6, 20, 0.55);
  -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  opacity: 0; transform: translateY(24px);
  animation: rise 1s cubic-bezier(.2,.8,.2,1) .5s forwards;
  text-align: center;
}
.kicker { margin: 0 0 6px; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sky); }
.kicker::before { content: ""; width: 9px; height: 6px; border-radius: 2px; background: var(--sky); box-shadow: 0 0 10px var(--sky); }
.card h1 { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-weight: 650; font-size: clamp(24px, 4.2vw, 30px); line-height: 1.15; letter-spacing: -0.01em; }

.meter { margin-top: 20px; }
.meter-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; font-size: 14px; }
.step { position: relative; flex: 1; min-width: 0; height: 21px; overflow: hidden; text-align: left; color: var(--text-muted); }
.step span { position: absolute; left: 0; right: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s; }
.step span.out { transform: translateY(-100%); opacity: 0; transition-duration: .45s, .2s; }
.step span.in { transform: translateY(100%); opacity: 0; }
.pct { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
.bar { position: relative; height: 6px; border-radius: 999px; background: rgba(243, 248, 248, 0.1); overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--royal), var(--sky) 55%, var(--cyan));
  box-shadow: 0 0 14px rgba(129, 194, 255, 0.7); transition: width .7s cubic-bezier(.2,.7,.2,1); }
.bar > span::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent); background-size: 40% 100%; background-repeat: no-repeat;
  animation: shimmer 1.4s linear infinite; }
.segments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.segments i { height: 3px; border-radius: 2px; background: rgba(243, 248, 248, 0.12); transition: background-color .4s, box-shadow .4s; }
.segments i.on { background: var(--sky); box-shadow: 0 0 8px rgba(129, 194, 255, 0.8); }

.enter { display: none; margin-top: 18px; height: 46px; padding: 0 22px; border-radius: 12px; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, var(--royal), #2F63E0); color: #FFFFFF; text-decoration: none; font: 600 15px/1 var(--font-body);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 10px 26px rgba(2, 54, 171, 0.5); }
.enter:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 0 1px var(--sky), 0 12px 30px rgba(129, 194, 255, 0.4); }
.enter:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
.enter svg { width: 18px; height: 18px; }
.is-done .enter { display: inline-flex; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }

/* Transição final para o jogo */
.flash { position: fixed; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(60% 60% at 50% 40%, rgba(129, 194, 255, 0.35), var(--bg) 70%); transition: opacity .7s ease; }
.is-leaving .flash { opacity: 1; }
.is-leaving .card, .is-leaving .top { transition: opacity .5s, transform .5s; opacity: 0 !important; transform: translateY(12px); }

.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: -40% 0; } to { background-position: 140% 0; } }

@media (max-width: 480px) {
  .card { padding: 20px 18px 18px; border-radius: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<script>
// Etapas, progresso e redirecionamento (funciona com ou sem a cena 3D)
(function () {
  // Destino ao terminar o carregamento
  var GAME_URL = 'https://kloudbrasil.com/jogo';
  var STEP_MS = 1100;        // duração de cada etapa simulada
  var LEAVE_DELAY_MS = 900;  // pausa em "Tudo pronto" antes da transição
  var LEAVE_MS = 1500;       // duração da animação de saída
  var STEPS = ['Verificando seu acesso', 'Carregando o cenário', 'Conectando com a equipe', 'Preparando o jogo'];

  // Estado compartilhado com a cena 3D
  var state = window.KLOUD_LOADER = { progress: 0, leaving: false };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Saudação pelo nome (opcional): ?u=email (ex.: maria.silva@... → "Maria")
  var u = new URLSearchParams(location.search).get('u') || '';
  var first = u.split('@')[0].split(/[._-]/)[0];
  if (first) {
    document.getElementById('title').textContent =
      'Bem-vindo, ' + first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
  }

  var bar = document.getElementById('bar');
  var fill = bar.querySelector('span');
  var pct = document.getElementById('pct');
  var stepBox = document.getElementById('step');
  var segs = document.querySelectorAll('#segments i');
  var live = document.getElementById('live');
  var card = document.getElementById('card');

  // Rótulo da etapa com troca animada (sai para cima, entra por baixo)
  function setStep(text) {
    var old = stepBox.querySelector('span:not(.out)');
    var next = document.createElement('span');
    next.className = 'in'; next.textContent = text;
    stepBox.appendChild(next);
    requestAnimationFrame(function () { requestAnimationFrame(function () { next.className = ''; }); });
    if (old) { old.className = 'out'; setTimeout(function () { old.remove(); }, 500); }
    live.textContent = text;
  }

  // Percentual contando suavemente até o alvo
  var shown = 0, target = 0, last = performance.now();
  function setProgress(p) {
    target = p;
    state.progress = p / 100;
    fill.style.width = p + '%';
    bar.setAttribute('aria-valuenow', String(Math.round(p)));
    if (reduce) { shown = p; pct.textContent = Math.round(p) + '%'; }
  }
  (function count(now) {
    now = now || performance.now();
    var dt = Math.min(0.25, (now - last) / 1000); last = now;
    if (!reduce) {
      shown += (target - shown) * (1 - Math.exp(-dt * 5));
      if (Math.abs(target - shown) < 0.2) shown = target;
      pct.textContent = Math.round(shown) + '%';
    }
    requestAnimationFrame(count);
  })();

  function enterGame() {
    try { window.top.location.href = GAME_URL; } catch (e) { location.href = GAME_URL; }
  }

  // Etapas simuladas (troque pelos eventos reais de carregamento do jogo, se houver)
  STEPS.forEach(function (label, i) {
    setTimeout(function () {
      setStep(label + '…');
      setProgress(((i + 0.6) / STEPS.length) * 100);
      if (i > 0) segs[i - 1].className = 'on';
    }, 600 + i * STEP_MS);
  });
  setTimeout(function () {
    segs[STEPS.length - 1].className = 'on';
    setProgress(100);
    setStep('Tudo pronto');
    document.body.classList.add('is-done');
    card.setAttribute('aria-busy', 'false');
    setTimeout(function () {
      state.leaving = true;
      document.body.classList.add('is-leaving');
      setTimeout(enterGame, reduce ? 300 : LEAVE_MS);
    }, LEAVE_DELAY_MS);
  }, 600 + STEPS.length * STEP_MS);
})();
</script>

<script type="module">
// Cena 3D: "k." da Kloud em vidro, anéis e pontos da marca sobre aurora animada
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const state = window.KLOUD_LOADER || { progress: 0, leaving: false };
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('gl');

// Sem WebGL o construtor lança erro e o módulo para: fica o plano B em CSS/SVG
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 10);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- Aurora: textura 2D redesenhada a cada quadro, usada como fundo ----------
// O vidro refrata o fundo, então as cores da aurora aparecem dentro do "k.".
const auroraCanvas = document.createElement('canvas');
auroraCanvas.width = 512; auroraCanvas.height = 320;
const actx = auroraCanvas.getContext('2d');
const aurora = new THREE.CanvasTexture(auroraCanvas);
aurora.colorSpace = THREE.SRGBColorSpace;
scene.background = aurora;
const BLOBS = [
  { c: '2, 54, 171',   r: 0.55, x: 0.28, y: 0.30, ax: 0.12, ay: 0.08, s: 0.21 },
  { c: '138, 107, 255', r: 0.40, x: 0.74, y: 0.34, ax: 0.10, ay: 0.10, s: 0.17 },
  { c: '69, 227, 255',  r: 0.24, x: 0.50, y: 0.40, ax: 0.18, ay: 0.08, s: 0.26 },
  { c: '129, 194, 255', r: 0.30, x: 0.20, y: 0.72, ax: 0.08, ay: 0.07, s: 0.19 },
  { c: '255, 122, 217', r: 0.22, x: 0.84, y: 0.66, ax: 0.07, ay: 0.09, s: 0.23 }
];
function drawAurora(t, boost) {
  const w = auroraCanvas.width, h = auroraCanvas.height;
  actx.globalCompositeOperation = 'source-over';
  const base = actx.createLinearGradient(0, 0, 0, h);
  base.addColorStop(0, '#081133'); base.addColorStop(1, '#02050F');
  actx.fillStyle = base; actx.fillRect(0, 0, w, h);
  actx.globalCompositeOperation = 'lighter';
  for (const b of BLOBS) {
    const x = (b.x + Math.sin(t * b.s + b.r * 9) * b.ax) * w;
    const y = (b.y + Math.cos(t * b.s * 0.8 + b.x * 7) * b.ay) * h;
    const r = b.r * w * (0.9 + 0.1 * Math.sin(t * 0.5 + b.y * 5));
    const g = actx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + b.c + ',' + (0.38 + boost * 0.18) + ')');
    g.addColorStop(1, 'rgba(' + b.c + ',0)');
    actx.fillStyle = g; actx.fillRect(0, 0, w, h);
  }
  aurora.needsUpdate = true;
}

// ---------- "k." da Kloud extrudado a partir do vetor da marca ----------
const K_BODY = 'M2.0 5.4 L0.0 11.9 L0.0 613.8 L2.0 620.2 L5.4 623.7 L10.9 625.7 L129.9 625.7 L135.8 623.7 L138.8 620.7 L140.7 616.3 L140.7 433.6 L143.2 427.7 L147.2 424.2 L151.1 422.7 L313.6 422.7 L333.8 426.2 L352.1 433.6 L369.9 445.9 L538.3 615.8 L548.6 622.2 L557.0 624.2 L706.2 624.2 L709.6 623.2 L714.6 618.8 L716.0 614.8 L716.0 609.9 L714.1 605.4 L485.9 375.3 L483.5 368.9 L485.4 361.5 L489.9 357.0 L698.8 189.1 L702.7 185.2 L704.2 181.7 L704.2 175.3 L699.8 168.9 L694.8 166.9 L634.6 166.9 L622.2 170.9 L502.2 267.2 L471.1 289.9 L441.5 308.6 L415.8 323.0 L389.6 335.8 L359.5 348.6 L304.7 366.9 L255.3 378.3 L204.9 385.2 L173.8 387.2 L150.1 387.2 L146.2 385.2 L142.7 381.7 L140.7 376.3 L140.7 9.4 L139.8 6.4 L135.8 2.0 L129.9 0.0 L10.9 0.0 L5.4 2.0Z';
const K_DOT = 'M861.2 535.3 L859.3 541.2 L859.3 603.0 L863.2 612.3 L871.6 619.8 L878.5 622.7 L886.9 624.2 L972.3 624.2 L980.2 622.7 L988.1 619.3 L997.0 610.4 L1000.0 601.0 L1000.0 543.7 L996.5 533.3 L988.6 525.4 L982.7 522.5 L974.8 520.5 L884.0 520.5 L876.5 522.5 L869.6 525.9 L863.7 531.4Z';
const K_SCALE = 0.0036, K_CX = 500, K_CY = 312.85;
function shapeFrom(d) {
  const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
  const shape = new THREE.Shape();
  for (let i = 0; i < nums.length; i += 2) {
    const x = (nums[i] - K_CX) * K_SCALE, y = -(nums[i + 1] - K_CY) * K_SCALE;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  return shape;
}
const DEPTH = 0.42;
const extrude = { depth: DEPTH, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.045, bevelSegments: 8, curveSegments: 1 };
function kGeometry(d) {
  const g = new THREE.ExtrudeGeometry(shapeFrom(d), extrude);
  g.translate(0, 0, -DEPTH / 2);
  g.computeVertexNormals();
  return g;
}

const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.02,
  transmission: 1, thickness: 1.4, ior: 1.6, dispersion: 6,
  iridescence: 0.9, iridescenceIOR: 1.3, iridescenceThicknessRange: [100, 600],
  clearcoat: 1, clearcoatRoughness: 0.02,
  attenuationColor: new THREE.Color('#BFD9FF'), attenuationDistance: 4,
  specularIntensity: 1, envMapIntensity: 1.8
});
const dotGlass = glass.clone();
dotGlass.color = new THREE.Color('#CFE7FF');
dotGlass.attenuationColor = new THREE.Color('#81C2FF');
dotGlass.attenuationDistance = 0.9;
dotGlass.emissive = new THREE.Color('#81C2FF');
dotGlass.emissiveIntensity = 0.1;

const hero = new THREE.Group();
const kBody = new THREE.Mesh(kGeometry(K_BODY), glass);
const kDot = new THREE.Mesh(kGeometry(K_DOT), dotGlass);
hero.add(kBody, kDot);

// Anéis de vidro iridescente
const ringMat = glass.clone();
ringMat.thickness = 0.3;
ringMat.dispersion = 2;
ringMat.iridescence = 1;
ringMat.attenuationColor = new THREE.Color('#C9B8FF');
const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.55, 0.045, 24, 220), ringMat);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.025, 16, 200), ringMat);
ring1.rotation.set(1.18, 0.12, 0);
ring2.rotation.set(1.32, -0.35, 0.4);

// "Pontos" da marca (retângulos arredondados) em vidro colorido, orbitando
const dotGeo = new RoundedBoxGeometry(0.34, 0.25, 0.14, 4, 0.07);
const TINTS = ['#81C2FF', '#2F63E0', '#8A6BFF', '#45E3FF', '#FF7AD9', '#81C2FF', '#5B8CFF', '#B59CFF'];
const orbiters = TINTS.map((tint, i) => {
  const m = glass.clone();
  m.color = new THREE.Color(tint).lerp(new THREE.Color('#ffffff'), 0.35);
  m.attenuationColor = new THREE.Color(tint);
  m.attenuationDistance = 0.7;
  m.thickness = 0.5;
  m.emissive = new THREE.Color(tint);
  m.emissiveIntensity = 0.3;
  const mesh = new THREE.Mesh(dotGeo, m);
  mesh.userData = {
    radius: 2.35 + (i % 3) * 0.45,
    speed: (0.22 + (i % 4) * 0.05) * (i % 2 ? 1 : -1),
    phase: (i / TINTS.length) * Math.PI * 2,
    tilt: 0.35 + (i % 3) * 0.12,
    lift: ((i % 5) - 2) * 0.18,
    spin: new THREE.Vector3(0.6 + i * 0.07, 0.9 - i * 0.05, 0.3),
    scale: 1 + (i % 3) * 0.3
  };
  return mesh;
});

const rig = new THREE.Group();   // posição/escala na tela
const tiltG = new THREE.Group(); // inclinação pelo ponteiro
rig.add(tiltG);
tiltG.add(hero, ring1, ring2, ...orbiters);
scene.add(rig);

// Poeira de partículas
const N = 260;
const pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  pos[i * 3] = (Math.random() - 0.5) * 16;
  pos[i * 3 + 1] = (Math.random() - 0.5) * 10;
  pos[i * 3 + 2] = (Math.random() - 0.5) * 6 - 1;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xBFE0FF, size: 0.025, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending
}));
scene.add(dust);

// Luzes coloridas para brilhos no vidro
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 4, 6); scene.add(key);
const p1 = new THREE.PointLight(0x81C2FF, 30, 20); p1.position.set(-4, 2, 3); scene.add(p1);
const p2 = new THREE.PointLight(0x8A6BFF, 24, 20); p2.position.set(4, -2, 3); scene.add(p2);

// ---------- Enquadramento responsivo ----------
// O "k." ocupa a parte de cima da tela; o cartão fica embaixo.
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const visH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visW = visH * camera.aspect;
  const s = Math.min(0.95, (visW * 0.86) / 6.6, (visH * 0.3) / 2.6);
  rig.scale.setScalar(s);
  const fromTop = h < 700 ? 0.35 : 0.37; // centro do "k." em fração da altura
  rig.position.y = visH * (0.5 - fromTop);
}
layout();
window.addEventListener('resize', layout);

// Ponteiro: leve paralaxe
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
if (!reduce) {
  window.addEventListener('pointermove', (e) => {
    pointer.tx = e.clientX / window.innerWidth - 0.5;
    pointer.ty = e.clientY / window.innerHeight - 0.5;
  });
}

const easeOutBack = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

const clock = new THREE.Clock();
let leaveStart = null;

function frame() {
  const t = clock.getElapsedTime();
  const prog = state.progress || 0;

  // Entrada: o "k." surge girando e cresce
  const intro = reduce ? 1 : Math.min(1, t / 1.6);
  const introS = easeOutBack(intro);

  // Saída: gira uma volta e avança para a câmera
  let leave = 0;
  if (state.leaving && !reduce) {
    if (leaveStart === null) leaveStart = t;
    leave = easeInOut(Math.min(1, (t - leaveStart) / 1.4));
  }

  pointer.x += (pointer.tx - pointer.x) * 0.05;
  pointer.y += (pointer.ty - pointer.y) * 0.05;
  tiltG.rotation.y = pointer.x * 0.35;
  tiltG.rotation.x = pointer.y * 0.25;

  hero.rotation.y = (1 - intro) * -1.6 + Math.sin(t * 0.45) * 0.38 + leave * Math.PI * 2;
  hero.rotation.x = Math.sin(t * 0.33) * 0.12;
  hero.position.y = Math.sin(t * 0.9) * 0.07;
  hero.position.z = leave * 6.5;
  hero.scale.setScalar(0.001 + introS * (1 + leave * 0.6));

  // O ponto da marca pulsa e acende conforme o progresso
  dotGlass.emissiveIntensity = 0.08 + prog * 0.5 + Math.sin(t * 3) * 0.06;

  // Anéis aceleram com o progresso e se abrem na saída
  const ringSpeed = 0.25 + prog * 0.9;
  ring1.rotation.z = t * ringSpeed;
  ring2.rotation.z = -t * ringSpeed * 1.3;
  ring1.scale.setScalar(introS * (1 + leave * 1.6));
  ring2.scale.setScalar(introS * (1 + leave * 2.2));

  for (const m of orbiters) {
    const d = m.userData;
    const a = d.phase + t * d.speed * (1 + prog * 0.8);
    const r = d.radius * (1 + leave * 1.8);
    m.position.set(Math.cos(a) * r, Math.sin(a) * r * d.tilt + d.lift, Math.sin(a) * r * 0.55);
    m.rotation.x = t * d.spin.x; m.rotation.y = t * d.spin.y; m.rotation.z = t * d.spin.z;
    m.scale.setScalar(d.scale * introS);
  }

  dust.rotation.y = t * 0.02;
  dust.position.y = (t * 0.05) % 1;

  drawAurora(t, prog);
  renderer.render(scene, camera);
  if (!reduce) requestAnimationFrame(frame);
}

frame();
document.documentElement.classList.add('has-3d');

// Com movimento reduzido, redesenha só quando a tela muda de tamanho
if (reduce) window.addEventListener('resize', () => frame());
</script>
</body>
</html>
