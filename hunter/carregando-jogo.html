<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111D3B">
<title>Carregando · Jogo Kloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&display=swap">
<style>
/* Tela de carregamento de entrada no jogo: a marca no centro, saudação e as
   etapas de preparação com uma barra de progresso. Ao terminar, leva para
   kloudbrasil.com/jogo. Usa sempre o marinho institucional, nos temas claro e escuro. */
:root {
  /* Cores institucionais (Manual de Identidade Visual Kloud) */
  --navy: #111D3B;        /* Azul 130 */
  --royal: #0236AB;       /* Azul 70 */
  --sky: #81C2FF;         /* Azul-claro, o ponto da marca */
  --offwhite: #F3F8F8;    /* Quase branco */

  --bg: var(--navy);
  --text: var(--offwhite);
  --text-muted: rgba(243, 248, 248, 0.66);
  --text-faint: rgba(243, 248, 248, 0.4);
  --track: rgba(243, 248, 248, 0.12);
  --success: #75E0A7;

  --font-display: "Magistral", "Archivo", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0B1328; }
}
:root[data-theme="dark"] { --bg: #0B1328; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(70% 55% at 50% 0%, rgba(2, 54, 171, 0.5), transparent 70%),
    radial-gradient(60% 45% at 50% 100%, rgba(129, 194, 255, 0.1), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.screen {
  min-height: 100%; display: flex; flex-direction: column;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center; }

/* Monograma "k." com o ponto pulsando */
.mark { width: 112px; height: auto; overflow: visible; }
.mark .dot { transform-box: fill-box; transform-origin: center; animation: dot 1.6s ease-in-out infinite; }
@keyframes dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.82); } }
.screen.is-done .mark .dot { animation: none; }

.greeting { display: flex; flex-direction: column; gap: 8px; }
.greeting h1 { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-weight: 650; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; letter-spacing: -0.01em; }
.greeting p { margin: 0; color: var(--text-muted); font-size: 16px; }

.progress { width: min(100%, 360px); display: flex; flex-direction: column; gap: 20px; }
.bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--royal), var(--sky)); transition: width .6s cubic-bezier(.2,.7,.2,1); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; text-align: left; }
.steps li { display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: center; font-size: 15px; color: var(--text-faint); transition: color .3s; }
.steps li.is-active { color: var(--text); }
.steps li.is-done { color: var(--text-muted); }
.state { width: 20px; height: 20px; display: grid; place-items: center; }
.state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
.is-active .state::before { width: 16px; height: 16px; opacity: 1; background: none; border: 2px solid rgba(129, 194, 255, 0.3); border-top-color: var(--sky); animation: spin .8s linear infinite; }
.is-done .state::before { display: none; }
.state svg { display: none; width: 18px; height: 18px; color: var(--success); }
.is-done .state svg { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

.ready { display: none; flex-direction: column; align-items: center; gap: 16px; }
.screen.is-done .ready { display: flex; }
.ready p { margin: 0; max-width: 34ch; font-size: 14px; color: var(--text-muted); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid rgba(243, 248, 248, 0.22); background: transparent; color: var(--text); font: 600 15px/1 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; transition: background-color .15s, border-color .15s; }
.btn:hover { background: rgba(243, 248, 248, 0.08); border-color: rgba(243, 248, 248, 0.4); }
.btn:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.btn--primary { background: #2F63E0; border-color: #2F63E0; }
.btn--primary:hover { background: #4A78EA; border-color: #4A78EA; }

.foot { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 13px; color: var(--text-faint); }
.foot .brand-logo { height: 14px; width: auto; opacity: 0.7; }
.foot .sep { width: 1px; height: 12px; background: rgba(243, 248, 248, 0.24); }
.foot .product { font-family: var(--font-display); font-stretch: 125%; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>

        <li><span class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Carregando o cenário</li>
        <li><span class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Conectando com a equipe</li>
        <li><span class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Preparando o jogo</li>
      </ol>
    </div>

    <div class="ready">
      <p id="redirect-note">Entrando no jogo…</p>
      <div class="actions">
        <a class="btn btn--primary" href="https://kloudbrasil.com/jogo" target="_top" id="enter">Entrar no jogo</a>
      </div>
    </div>

    <p class="visually-hidden" id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>

</div>

<script>
(function () {
  // Destino ao terminar o carregamento
  var GAME_URL = 'https://kloudbrasil.com/jogo';
  var REDIRECT_MS = 1500;

  // Saudação pelo nome (opcional): ?u=email (ex.: maria.silva@... → "Maria")
  var u = new URLSearchParams(location.search).get('u') || '';
  var first = u.split('@')[0].split(/[._-]/)[0];
  if (first) {
    document.getElementById('title').textContent =
      'Bem-vindo ao jogo, ' + first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
  }

  var screen = document.getElementById('screen');
  var main = document.getElementById('main');
  var bar = document.getElementById('bar');
  var fill = bar.querySelector('span');
  var items = Array.prototype.slice.call(document.querySelectorAll('#steps li'));
  var live = document.getElementById('live');
  var subtitle = document.getElementById('subtitle');
  var STEP_MS = 900;
  var timers = [];

  function setProgress(pct) {
    fill.style.width = pct + '%';
    bar.setAttribute('aria-valuenow', String(Math.round(pct)));
  }

  // Abre o jogo; dentro de um iframe tenta trocar a página inteira
  function enterGame() {
    try { window.top.location.href = GAME_URL; } catch (e) { location.href = GAME_URL; }
  }

  // Etapas simuladas (troque pelos eventos reais de carregamento do jogo, se houver)
  function run() {
    items.forEach(function (li, i) {
      timers.push(setTimeout(function () {
        if (i > 0) items[i - 1].className = 'is-done';
        li.className = 'is-active';
        live.textContent = li.textContent.trim() + '…';
        setProgress((i + 0.5) / items.length * 100);
      }, 300 + i * STEP_MS));
    });
    timers.push(setTimeout(function () {
      items[items.length - 1].className = 'is-done';
      setProgress(100);
      screen.classList.add('is-done');
      main.setAttribute('aria-busy', 'false');
      subtitle.textContent = 'Tudo pronto.';
      live.textContent = 'Tudo pronto. Entrando no jogo.';
      timers.push(setTimeout(enterGame, REDIRECT_MS));
    }, 300 + items.length * STEP_MS));
  }

  run();
})();
</script>
